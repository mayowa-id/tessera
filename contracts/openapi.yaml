      tags: [Staff]
      operationId: updateJobRole
      summary: Update or deactivate a jobrole
      description: Full editable representation required. Deactivation retains the record and existing relationships. No hard-delete operation is exposed.
      security: [{ session: [], csrf: [], browserRequest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogInput' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
    browserRequest:
      type: apiKey
      in: header
      name: X-Tessera-Request
    session:
      type: apiKey
      in: cookie
      name: tessera_session
  parameters:
    OrgID:
      in: path
      name: orgID
      required: true
      schema: { type: string, format: uuid }
    RecordID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    Search:
      in: query
      name: q
      schema: { type: string, maxLength: 120 }
    IncludeInactive:
      in: query
      name: include_inactive
      schema: { type: boolean, default: false }
    BrowserRequest:
      in: header
      name: X-Tessera-Request
      required: true
      schema: { type: string, enum: ['1'] }
  responses:
    Error:
      description: Structured request error; rate-limited responses include Retry-After
      content:
        application/json:
          schema:
            type: object
            required: [code, message, request_id]
            properties:
              code: { type: string }
              message: { type: string }
              request_id: { type: string }
  schemas:
    Employee:
      type: object
      required: [id, display_name, active, job_role_ids]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        active: { type: boolean }
        job_role_ids:
          type: array
          items: { type: string, format: uuid }
    EmployeeInput:
      type: object
      additionalProperties: false
      required: [display_name, active, job_role_ids]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        active: { type: boolean }
        job_role_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Existing inactive qualifications may be retained; new qualifications must reference active roles in this organization.
          items: { type: string, format: uuid }
    CatalogItem:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
    CatalogInput:
      type: object
      additionalProperties: false
      required: [name, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        active: { type: boolean }
    EmployeePage:
      type: object
      required: [items, offset, limit, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        offset: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }
    CatalogPage:
      type: object
      required: [items, offset, limit, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogItem' }
        offset: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }
    Identity:
      type: object
      required: [user, memberships, csrf_token]
      properties:
        user:
          type: object
          required: [id, email, display_name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            display_name: { type: string }
        memberships:
          type: array
          items:
            type: object
            required: [org_id, name, timezone, role]
            properties:
              org_id: { type: string, format: uuid }
              name: { type: string }
              timezone: { type: string }
              role: { type: string, enum: [admin, manager, employee] }
        csrf_token: { type: string, description: 'Keep in memory; send as X-CSRF-Token on authenticated mutations.' }
