        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/organizations/{orgID}/rosters:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Rosters]
      operationId: listRosters
      summary: List rosters for one local Monday-based week
      security: [{ session: [] }]
      parameters:
        - in: query
          name: week_start
          required: true
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RosterPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      tags: [Rosters]
      operationId: createDraftRoster
      summary: Create one draft roster per active location and local week
      security: [{ session: [], csrf: [], browserRequest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location_id, week_start]
              additionalProperties: false
              properties:
