        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/organizations/{orgID}/rosters/{rosterID}/publish:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/RosterID'
    post:
      tags: [Rosters]
      operationId: publishRoster
      summary: Validate and publish a fully assigned draft
      description: Revalidates every assignment under the scheduling transaction lock. Empty rosters, unassigned shifts, and hard violations block publication. Warnings are returned on success.
      security: [{ session: [], csrf: [], browserRequest: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RosterLifecycleResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/organizations/{orgID}/rosters/{rosterID}/archive:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/RosterID'
    post:
      tags: [Rosters]
      operationId: archiveRoster
      summary: Archive an ended published roster
      description: Requires the local roster week and all shifts, including overnight spillovers, to have ended.
      security: [{ session: [], csrf: [], browserRequest: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RosterLifecycleResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/organizations/{orgID}/my-shifts:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Schedules]
      operationId: getMyShifts
      summary: Read only the authenticated user's published assignments and archived history
      description: Employee identity is resolved from the session. A from/to instant range of at most 62 elapsed days is required. Draft rosters never appear.
      security: [{ session: [] }]
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyShiftPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/organizations/{orgID}/activity:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Activity]
      operationId: listActivity
      summary: Read the organization's append-only activity feed (manager/admin)
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
    browserRequest:
      type: apiKey
      in: header
      name: X-Tessera-Request
    session:
      type: apiKey
      in: cookie
      name: tessera_session
  parameters:
    RosterID:
      in: path
      name: rosterID
      required: true
      schema: { type: string, format: uuid }
    OrgID:
      in: path
      name: orgID
      required: true
      schema: { type: string, format: uuid }
    RecordID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    Search:
      in: query
      name: q
      schema: { type: string, maxLength: 120 }
    IncludeInactive:
      in: query
      name: include_inactive
      schema: { type: boolean, default: false }
    BrowserRequest:
      in: header
      name: X-Tessera-Request
      required: true
      schema: { type: string, enum: ['1'] }
  responses:
    Error:
      description: Structured request error; rate-limited responses include Retry-After
      content:
        application/json:
          schema:
            type: object
            required: [code, message, request_id]
            properties:
              code: { type: string }
              message: { type: string }
              request_id: { type: string }
              violations:
                type: array
                items: { $ref: '#/components/schemas/ScheduleViolation' }
  schemas:
    RosterLifecycleResult:
      type: object
      required: [detail, violations]
      properties:
        detail: { $ref: '#/components/schemas/RosterDetail' }
        violations:
          type: array
          items: { $ref: '#/components/schemas/ScheduleViolation' }
    MyShift:
      type: object
      required: [id, roster_id, location_name, job_role_name, starts_at, ends_at, timezone, state]
      properties:
        id: { type: string, format: uuid }
        roster_id: { type: string, format: uuid }
        location_name: { type: string }
        job_role_name: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        timezone: { type: string }
        state: { type: string, enum: [published, archived] }
    MyShiftPage:
      type: object
      required: [items, offset, limit, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MyShift' }
        offset: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }
    ActivityEvent:
      type: object
      required: [id, action, entity_type, entity_id, entity_label, actor_user_id, actor_name, created_at, before, after]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        entity_label: { type: string }
        actor_user_id: { type: string, format: uuid }
        actor_name: { type: string }
        created_at: { type: string, format: date-time }
        before: { type: object, nullable: true, additionalProperties: true }
        after: { type: object, nullable: true, additionalProperties: true }
    ActivityPage:
      type: object
      required: [items, offset, limit, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        offset: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }
    Roster:
      type: object
      required: [id, location_id, location_name, week_start, timezone, state]
      properties:
        id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        location_name: { type: string }
        week_start: { type: string, format: date }
        timezone: { type: string }
        state: { type: string, enum: [draft, published, archived] }
    RosterPage:
      type: object
      required: [items, offset, limit, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Roster' }
        offset: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }
    RosterDetail:
      type: object
      required: [roster, shifts]
      properties:
        roster: { $ref: '#/components/schemas/Roster' }
        shifts:
          type: array
          items: { $ref: '#/components/schemas/Shift' }
    Shift:
      type: object
      required: [id, job_role_id, job_role_name, starts_at, ends_at, employee_id, employee_name]
      properties:
        id: { type: string, format: uuid }
        job_role_id: { type: string, format: uuid }
        job_role_name: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        employee_id: { type: string, nullable: true }
        employee_name: { type: string, nullable: true }
    ShiftInput:
      type: object
      additionalProperties: false
      required: [job_role_id, starts_at, ends_at]
      properties:
        job_role_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time, description: 'Explicit offset required. Start must fall within the roster local week.' }
        ends_at: { type: string, format: date-time, description: 'Later than start, at most 24 elapsed hours. Overnight Sunday shifts may end on Monday.' }
    AssignmentInput:
      type: object
      additionalProperties: false
      required: [employee_id]
      properties:
        employee_id: { type: string, format: uuid }
    ScheduleViolation:
      type: object
      required: [code, severity, message]
      properties:
        code: { type: string }
        severity: { type: string, enum: [hard, warning] }
        message: { type: string }
        related_shift_id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        shift_id: { type: string, format: uuid }
        week_start: { type: string, format: date }
    ShiftResult:
      type: object
      required: [shift, violations]
      properties:
        shift: { $ref: '#/components/schemas/Shift' }
        violations:
          type: array
          items: { $ref: '#/components/schemas/ScheduleViolation' }
    Employee:
      type: object
      required: [id, display_name, active, job_role_ids]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        active: { type: boolean }
        job_role_ids:
          type: array
          items: { type: string, format: uuid }
    EmployeeInput:
      type: object
      additionalProperties: false
      required: [display_name, active, job_role_ids]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        active: { type: boolean }
        job_role_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Existing inactive qualifications may be retained; new qualifications must reference active roles in this organization.
          items: { type: string, format: uuid }
    CatalogItem:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
    CatalogInput:
      type: object
      additionalProperties: false
      required: [name, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        active: { type: boolean }
    EmployeePage:
      type: object
      required: [items, offset, limit, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        offset: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }
    CatalogPage:
      type: object
      required: [items, offset, limit, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogItem' }
        offset: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }
    Identity:
      type: object
      required: [user, memberships, csrf_token]
      properties:
        user:
          type: object
          required: [id, email, display_name]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            display_name: { type: string }
        memberships:
          type: array
          items:
            type: object
            required: [org_id, name, timezone, role]
            properties:
              org_id: { type: string, format: uuid }
              name: { type: string }
              timezone: { type: string }
              role: { type: string, enum: [admin, manager, employee] }
        csrf_token: { type: string, description: 'Keep in memory; send as X-CSRF-Token on authenticated mutations.' }
