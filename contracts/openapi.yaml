        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Rosters]
      operationId: unassignShift
      summary: unassignShift on a draft roster
      description: Manager-only, CSRF-protected. Assigned shift edits re-run scheduling rules. Violations with severity hard return 409; warnings are included in successful responses.
      security: [{ session: [], csrf: [], browserRequest: [] }]
