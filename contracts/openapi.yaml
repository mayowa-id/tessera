openapi: 3.0.3
info:
  title: Tessera API
  version: 0.2.0
  description: Foundation, session authentication, and organization access. Browser requests use the frontend same-origin API proxy.
servers:
  - url: http://localhost:8080
paths:
  /api/healthz:
    get:
      operationId: getLiveness
      summary: Check that the API process is alive
      responses:
        '200':
          description: Process is alive; does not check the database
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /api/readyz:
    get:
      operationId: getReadiness
      summary: Check that PostgreSQL is reachable
      responses:
        '200':
          description: API and database are available
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status:
                    type: string
                    enum: [ready]
                  database:
                    type: string
                    enum: [connected]
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status, code, message, request_id]
                properties:
                  status:
                    type: string
                    enum: [unavailable]
                  code:
                    type: string
                    enum: [DATABASE_UNAVAILABLE]
                  message:
                    type: string
                  request_id:
                    type: string
  /api/auth/login:
    post:
      operationId: login
      summary: Start a 12-hour browser session
      description: Requires JSON, the configured frontend Origin, and X-Tessera-Request. Maximum 10 attempts per normalized email per 15-minute window. Successful reauthentication revokes the previous browser session.
      parameters:
        - $ref: '#/components/parameters/BrowserRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, description: '1 to 72 bytes; demo passwords require at least 12 bytes.' }
      responses:
        '200':
          description: Session established through a host-only HttpOnly SameSite=Lax cookie; Secure in production
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/auth/me:
    get:
      operationId: getCurrentIdentity
      summary: Restore identity, authorized memberships, and the session-bound CSRF token
      security: [{ session: [] }]
      responses:
        '200':
          description: Current identity; response must not be cached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identity' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the session and expire its cookie
      description: Requires the configured frontend Origin and the session-bound CSRF header returned by login or me.
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/BrowserRequest'
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/organizations/{orgID}/summary:
    get:
      operationId: getOrganizationSummary
      summary: Read active staff and location counts plus job-role count (manager or admin)
      security: [{ session: [] }]
      parameters:
        - in: path
          name: orgID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Counts scoped to an authorized organization
          content:
            application/json:
              schema:
                type: object
                required: [employees, locations, job_roles]
                properties:
                  employees: { type: integer, format: int64 }
                  locations: { type: integer, format: int64 }
                  job_roles: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/organizations/{orgID}/employees:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Staff]
      operationId: listEmployees
      summary: List employees with bounded pagination and literal name search
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      tags: [Staff]
      operationId: createEmployee
      summary: Create a staff record without a login
      description: Manager/admin only. Requires the configured Origin and the browser/CSRF headers supplied by the session interceptor.
      security: [{ session: [], csrf: [], browserRequest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/organizations/{orgID}/employees/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/RecordID'
    get:
      tags: [Staff]
      operationId: getEmployee
      summary: Read a employee in the authorized organization
      security: [{ session: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      tags: [Staff]
      operationId: updateEmployee
      summary: Update or deactivate a employee
      description: Full editable representation required. Deactivation retains the record and existing relationships. No hard-delete operation is exposed.
      security: [{ session: [], csrf: [], browserRequest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/organizations/{orgID}/locations:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Staff]
      operationId: listLocations
      summary: List locations with bounded pagination and literal name search
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      tags: [Staff]
      operationId: createLocation
      summary: Create a location
      description: Manager/admin only. Requires the configured Origin and the browser/CSRF headers supplied by the session interceptor.
      security: [{ session: [], csrf: [], browserRequest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogInput' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/organizations/{orgID}/locations/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/RecordID'
    get:
      tags: [Staff]
      operationId: getLocation
      summary: Read a location in the authorized organization
      security: [{ session: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      tags: [Staff]
      operationId: updateLocation
      summary: Update or deactivate a location
      description: Full editable representation required. Deactivation retains the record and existing relationships. No hard-delete operation is exposed.
      security: [{ session: [], csrf: [], browserRequest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogInput' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/organizations/{orgID}/job-roles:
    parameters:
      - $ref: '#/components/parameters/OrgID'
    get:
      tags: [Staff]
      operationId: listJobRoles
      summary: List job-roles with bounded pagination and literal name search
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      tags: [Staff]
      operationId: createJobRole
      summary: Create a jobrole
      description: Manager/admin only. Requires the configured Origin and the browser/CSRF headers supplied by the session interceptor.
      security: [{ session: [], csrf: [], browserRequest: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogInput' }
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/organizations/{orgID}/job-roles/{id}:
    parameters:
      - $ref: '#/components/parameters/OrgID'
      - $ref: '#/components/parameters/RecordID'
    get:
      tags: [Staff]
      operationId: getJobRole
      summary: Read a jobrole in the authorized organization
      security: [{ session: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
